<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for-loop oppgaver</title>
</head>
<body>
    <h2>Sjekk konsoll output med F12</h2>
    <h3>Denne skal printe 2 gangen mellom 2 og 20</h3>
    <button onclick="toGangen()">Løsning 1</button>


    <h2>Tell antall vokaler i en string</h2>
    <input onchange="tellVokaler(this.value)">
    <div>Vokaler: <spani id="vokaler"></span></div>


    <h2>Reverser inputen</h2>
    <input onchange="reverserInput(this.value)">
    <div>Din reverserte string:<span id="reverse"> </span></div>
    

<script>
    // To Gangen
    function toGangen(){
        for (let i = 2; i <= 20; i += 2){
            console.log(i);
        }
    }


    // Antall vokaler i string
    const alleVokaler = ["a", "e", "i", "o", "u", "y", "æ", "ø", "å"]
    let nyeVokaler = "";

    function tellVokaler(message){
        nyeVokaler = ""
        for (const msg of message){
            if (alleVokaler.includes(msg)){
                nyeVokaler += msg + ", ";
                document.getElementById('vokaler').innerHTML = nyeVokaler;
            }
        }
    }


    //Reverser stringen

    function reverserInput(message){
        let newMessage = ""
        for (let i = message.length - 1; i >= 0; i--){
            newMessage += message[i];
            console.log(newMessage);
        }
        document.getElementById('reverse').innerHTML = newMessage

    }
    
</script>
</body>
</html>
